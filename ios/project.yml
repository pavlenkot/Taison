# Необов'язковий швидкий шлях: XcodeGen збирає проєкт з цього опису.
#   brew install xcodegen && cd ios && xcodegen generate && open Taison.xcodeproj
# Якщо XcodeGen ставити не хочеться — створіть проєкт руками за README.md.

name: Taison
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Taison:
    type: application
    platform: iOS
    sources:
      - path: Taison
    info:
      path: Taison/Info.plist
      properties:
        CFBundleDisplayName: Taison
        CFBundleShortVersionString: "0.1"
        NSCameraUsageDescription: Камера потрібна, щоб сканувати чеки та документи
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.taison
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
