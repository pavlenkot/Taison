name: Перевірки

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Типи
        run: npm run typecheck

      - name: Тести
        run: npm test

      # Збірка потребує змінних середовища. Тут навмисно підставні:
      # перевіряємо, що застосунок збирається, а не що ключі правильні.
      - name: Збірка
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          AI_PROVIDER: gemini
          GEMINI_API_KEY: placeholder
