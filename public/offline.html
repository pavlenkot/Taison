<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Немає зв'язку — Taskly</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #080D12; color: #F5F5F7;
      }
      main { max-width: 340px; padding: 24px; text-align: center; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.5; color: #ADADAD; margin: 0; }
      button {
        margin-top: 20px; padding: 10px 18px; font-size: 14px; font-weight: 600;
        color: #080D12; background: linear-gradient(135deg, #FF944D, #FF7E48); border: 0; border-radius: 18px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div style="font-size: 40px; margin-bottom: 12px">📡</div>
      <h1>Немає зв'язку</h1>
      <p>
        Застосунок навмисно не показує збережені цифри без мережі: застарілий
        баланс гірший за його відсутність. Щойно зв'язок повернеться —
        оновіть сторінку.
      </p>
      <button type="button" onclick="location.reload()">Спробувати ще раз</button>
    </main>
  </body>
</html>
